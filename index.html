<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FC Tournament</title>
    <script>
      // Aplica o tema (claro/escuro) antes do React montar, pra nao piscar o
      // tema errado por uma fracao de segundo ao carregar a pagina.
      ;(function () {
        try {
          var stored = window.localStorage.getItem('fc-tournament-theme')
          var isDark = stored === 'dark' || (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', isDark)
        } catch (error) {
          // Ignora (modo privado sem localStorage, etc.) e fica no tema claro.
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
